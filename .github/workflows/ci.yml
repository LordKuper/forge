name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: Validate .NET solution
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Validate Stage 1
        shell: pwsh
        run: ./.github/scripts/test-stage1.ps1

  lint:
    name: Lint and audit .NET solution
    runs-on: windows-2025
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Format and vulnerability audit
        shell: pwsh
        run: ./.github/scripts/lint.ps1

  same-user-isolation:
    name: Validate same-user pipe and mutex isolation
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Validate CurrentUserOnly control-plane pipe and project-lease mutex isolation
        shell: pwsh
        run: ./.github/scripts/test-same-user-isolation.ps1

  portable:
    name: Validate portable core (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Validate the ADR 0007 neutral projects
        shell: pwsh
        run: ./.github/scripts/test-portable.ps1

  test:
    name: Test release publisher
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Verify toolchain
        shell: pwsh
        run: ./.github/scripts/assert-toolchain.ps1

      - name: Test
        shell: pwsh
        run: ./.github/tests/publish-release.Tests.ps1

      - name: Validate Stage 0 contracts
        shell: pwsh
        run: ./tests/Forge.Tests/Contracts/Stage0.Contracts.Tests.ps1
