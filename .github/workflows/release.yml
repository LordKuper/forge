name: Release Forge

on:
  push:
    branches: [main]
  # Retry path for a push whose Release Forge run never started at all (a dropped GitHub Actions
  # trigger delivery, not a job failure `gh run rerun` could retry — observed in practice: a squash
  # merge landed on `main`, no CI/Release Validation/Release Forge run of any kind was ever created
  # for that commit, and no incident explained it). AGENTS.md allows manual publication only to
  # retry a workflow that failed to do its job for a commit that already passed review; this is that
  # retry path, restricted to `main` itself by the job-level `if:` below so a manual dispatch can
  # never target an unreviewed branch the way the `push` trigger's own `branches:` filter already
  # prevents.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # This job has no `needs:` on the CI/validation jobs: it trusts that the commit landing on `main` already
  # passed them as required status checks (branch protection: required_status_checks.strict = true,
  # enforce_admins = true, contexts "Validate .NET solution", "Lint and audit .NET solution", "Validate portable
  # core (ubuntu-24.04)", "Validate portable core (macos-14)", "Test release publisher", "Validate release"). If
  # that protection is ever relaxed or a required context removed, this job publishes without a build/test/lint
  # gate. The vulnerability audit below re-runs here (not just in the `lint` PR job) so a re-run release still
  # gets a fresh dependency check even though the build/test/format gate itself is not repeated.
  release:
    name: Publish release
    # Only ever runs for `main` itself, whether triggered by the push (already scoped to
    # `branches: [main]`, so this is a no-op there) or by a manual `workflow_dispatch` (which can
    # otherwise target any branch/tag) -- a manual retry must never publish from a ref that skipped
    # required status checks.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify toolchain
        shell: pwsh
        run: ./.github/scripts/assert-toolchain.ps1

      - name: Install MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Build release assets
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'artifacts/release'
          dotnet restore Forge.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/assert-no-vulnerable-packages.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/Publish-WindowsBundle.ps1 -RuntimeIdentifier win-x64 -OutputDirectory $output -SkipRestore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/Publish-WindowsBundle.ps1 -RuntimeIdentifier win-arm64 -OutputDirectory $output -SkipRestore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundles = @(Get-ChildItem -LiteralPath $output -Filter '*.zip' | Sort-Object Name)
          $checksums = foreach ($bundle in $bundles) {
            $hash = Get-FileHash -LiteralPath $bundle.FullName -Algorithm SHA256
            "$($hash.Hash)  $($bundle.Length)  $($bundle.Name)"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $output 'checksums.txt')
          dotnet list Forge.slnx package --include-transitive --format json | Set-Content -LiteralPath (Join-Path $output 'sbom.json')
          "RELEASE_ASSETS=$($bundles.FullName + (Join-Path $output 'checksums.txt') + (Join-Path $output 'sbom.json') -join ';')" >> $env:GITHUB_ENV

      - name: Validate and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUIRE_ASSETS: "true"
        run: ./.github/scripts/publish-release.ps1
