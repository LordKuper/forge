name: Release Forge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    name: Validate .NET solution
    runs-on: windows-2025
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Install MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Validate Stage 1
        shell: pwsh
        run: ./.github/scripts/test-stage1.ps1

  test:
    name: Test release publisher
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify toolchain
        shell: pwsh
        run: ./.github/scripts/assert-toolchain.ps1

      - name: Test
        shell: pwsh
        run: ./.github/tests/publish-release.Tests.ps1

      - name: Validate Stage 0 contracts
        shell: pwsh
        run: ./tests/Forge.Tests/Contracts/Stage0.Contracts.Tests.ps1

  validate:
    if: github.event_name == 'pull_request'
    name: Validate release
    needs: [dotnet, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify toolchain
        shell: pwsh
        run: ./.github/scripts/assert-toolchain.ps1

      - name: Validate
        shell: pwsh
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_COMMIT_BODY: ${{ github.event.pull_request.body }}
          RELEASE_COMMIT_SUBJECT: ${{ github.event.pull_request.title }}
        run: ./.github/scripts/publish-release.ps1 -ValidateOnly

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Publish release
    needs: [dotnet, test]
    permissions:
      contents: write
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify toolchain
        shell: pwsh
        run: ./.github/scripts/assert-toolchain.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Install MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Build release assets
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'artifacts/release'
          ./build/Publish-WindowsBundle.ps1 -RuntimeIdentifier win-x64 -OutputDirectory $output
          ./build/Publish-WindowsBundle.ps1 -RuntimeIdentifier win-arm64 -OutputDirectory $output
          $bundles = @(Get-ChildItem -LiteralPath $output -Filter '*.zip' | Sort-Object Name)
          $checksums = foreach ($bundle in $bundles) {
            $hash = Get-FileHash -LiteralPath $bundle.FullName -Algorithm SHA256
            "$($hash.Hash)  $($bundle.Length)  $($bundle.Name)"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $output 'checksums.txt')
          dotnet list Forge.slnx package --include-transitive --format json | Set-Content -LiteralPath (Join-Path $output 'sbom.json')
          "RELEASE_ASSETS=$($bundles.FullName + (Join-Path $output 'checksums.txt') + (Join-Path $output 'sbom.json') -join ';')" >> $env:GITHUB_ENV

      - name: Validate and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUIRE_ASSETS: "true"
        run: ./.github/scripts/publish-release.ps1
