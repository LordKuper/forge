name: Release Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Verify toolchain
        shell: pwsh
        run: ./.github/scripts/assert-toolchain.ps1

      - name: Validate
        shell: pwsh
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_COMMIT_BODY: ${{ github.event.pull_request.body }}
          RELEASE_COMMIT_SUBJECT: ${{ github.event.pull_request.title }}
        run: ./.github/scripts/publish-release.ps1 -ValidateOnly
